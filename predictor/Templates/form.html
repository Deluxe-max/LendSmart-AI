<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LendSmart AI Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="card shadow-lg border-0 rounded-lg">
                    <div class="card-header bg-dark text-white text-center py-4">
                        <h2 class="mb-0 fw-bold">LendSmart AI</h2>
                        <p class="mb-0 text-info">Instant, Data-Driven Credit Decisions</p>
                    </div>
                    
                    <div class="card-body p-5">
                        
                        {% if result %}
                            {% if 'APPROVED' in result %}
                                <div class="alert alert-success text-center fs-4 fw-bold mb-4 shadow-sm" role="alert">
                                    {{ result }}
                                </div>
                            {% else %}
                                <div class="alert alert-danger text-center fs-4 fw-bold mb-4 shadow-sm" role="alert">
                                    {{ result }}
                                </div>
                            {% endif %}
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}
                            
                            <h5 class="text-muted mb-4 border-bottom pb-2">Applicant Demographics</h5>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Gender</label>
                                    <select name="Gender" class="form-select" required>
                                        <option value=""></option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Married</label>
                                    <select name="Married" class="form-select" required>
                                        <option value=""></option>
                                        <option value="Yes">Yes</option>
                                        <option value="No">No</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Dependents (0 - 3)</label>
                                    <input type="number" name="Dependents" class="form-control" min="0" max="3" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Education</label>
                                    <select name="Education" class="form-select" required>
                                        <option value=""></option>
                                        <option value="Graduate">Graduate</option>
                                        <option value="Not Graduate">Not Graduate</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Self Employed</label>
                                    <select name="Self_Employed" class="form-select" required>
                                        <option value=""></option>
                                        <option value="Yes">Yes</option>
                                        <option value="No">No</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Property Area</label>
                                    <select name="Property_Area" class="form-select" required>
                                        <option value=""></option>
                                        <option value="Urban">Urban</option>
                                        <option value="Semiurban">Semiurban</option>
                                        <option value="Rural">Rural</option>
                                    </select>
                                </div>
                            </div>

                            <h5 class="text-muted mt-4 mb-4 border-bottom pb-2">Financial Details</h5>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Applicant Income ($)</label>
                                    <input type="number" name="ApplicantIncome" class="form-control" placeholder="e.g. 5000" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Coapplicant Income ($)</label>
                                    <input type="number" name="CoapplicantIncome" class="form-control" placeholder="e.g. 700" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Loan Amount ($)</label>
                                    <input type="number" name="LoanAmount" class="form-control" placeholder="e.g. 2000" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Loan Term (Days)</label>
                                    <input type="number" name="Loan_Amount_Term" class="form-control" placeholder="e.g. 360" required>
                                </div>

                                <div class="col-md-12 mb-4">
                                    <label class="form-label fw-bold">Credit History</label>
                                    <select name="Credit_History" class="form-select" required>
                                        <option value=""></option>
                                        <option value="0">Bad</option>
                                        <option value="1">Good</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-grid gap-2 mt-2">
                                <button type="submit" class="btn btn-dark btn-lg fw-bold shadow-sm">Analyze Application</button>
                            </div>

                        </form>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

</body>
</html>
